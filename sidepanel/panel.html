<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Ensemble</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<header>
  <h1>Ensemble</h1>
  <span id="store-state">No Shopify store detected on this tab</span>
</header>
<div id="hints" hidden></div>
<section id="photo-section">
  <img id="photo-preview" hidden alt="Your photo">
  <button id="photo-remove" hidden aria-label="Remove your photo">x</button>
  <label class="button">Set your photo<input id="photo-input" type="file" accept="image/*" hidden></label>
</section>
<section id="catalog-section" hidden>
  <div class="row">
    <input id="catalog-search" type="search" placeholder="Search this store">
    <button id="load-catalog">Load catalog</button>
  </div>
  <div id="catalog-grid" class="grid"></div>
</section>
<section id="look-section">
  <div class="row">
    <h2>Current look</h2>
    <button id="new-look" hidden>New look</button>
    <span id="look-total"></span>
  </div>
  <div id="look-items" class="grid"></div>
  <div class="row">
    <button id="suggest">Suggest matches</button>
    <button id="render">Render on me</button>
    <button id="add-to-carts">Add all to carts</button>
  </div>
  <div id="suggestions" class="grid"></div>
  <div id="renders"></div>
  <div id="status"></div>
</section>
<script type="module" src="panel.js"></script>
</body>
</html>
